version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd Frontend-1
        - npm install
    build:
      commands:
        - export PUBLIC_URL=/
        - npm run build
  artifacts:
    baseDirectory: Frontend-1/build
    files:
      - "**/*"
  cache:
    paths:
      - Frontend-1/node_modules/**/*
      - Frontend-1/build/**/*
  customHeaders:
    - pattern: "**/*"
      headers:
        - key: X-Content-Type-Options
          value: nosniff
        - key: X-Frame-Options
          value: DENY
        - key: X-XSS-Protection
          value: 1; mode=block
  customRewrites:
    - source: </^[^.]+$|\.(?!(css|gif|ico|jpg|js|png|txt|svg|woff|woff2|ttf|eot)$)([^.]+$)/>
      target: /index.html
      status: "200"
